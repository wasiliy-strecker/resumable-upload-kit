services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: resumable_upload_kit_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d resumable_upload_kit_test']
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
